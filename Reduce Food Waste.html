<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Reduce Food Waste</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a phone-sized app (full screen on phones, framed on desktop) with a screen list beside it on wide viewports.
   Freshness drives the colour system: red = today, amber = soon, green = fine. Spruce green is the brand. */
:root{
  --bg:#F1F5F0;--surface:#FFFFFF;--surface2:#E7EEE7;--ink:#12231B;--muted:#5B6D63;--line:#D9E3DA;
  --brand:#12543C;--brand-ink:#FFFFFF;--brand-soft:#DCEFE3;
  --good:#2E9D5C;--good-bg:#DDF1E4;--warn:#9A5B00;--warn-bg:#FCEFD2;--bad:#BF372D;--bad-bg:#FBE1DE;
  --deal:#F3B100;--deal-ink:#2A1E00;--stage:#DCE6DD;--frame:#0F1A14;--shadow:0 1px 2px rgba(18,35,27,.06),0 8px 24px rgba(18,35,27,.08);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1510;--surface:#13221A;--surface2:#1A2D23;--ink:#E6F0E8;--muted:#8FA699;--line:#24382D;
  --brand:#58D08F;--brand-ink:#06301D;--brand-soft:#16382A;--good:#58D08F;--good-bg:#173B28;--warn:#F2B84B;--warn-bg:#3A2C0E;--bad:#FF8A80;--bad-bg:#3C1815;
  --stage:#060C09;--frame:#02070A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1510;--surface:#13221A;--surface2:#1A2D23;--ink:#E6F0E8;--muted:#8FA699;--line:#24382D;
  --brand:#58D08F;--brand-ink:#06301D;--brand-soft:#16382A;--good:#58D08F;--good-bg:#173B28;--warn:#F2B84B;--warn-bg:#3A2C0E;--bad:#FF8A80;--bad-bg:#3C1815;
  --stage:#060C09;--frame:#02070A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.side{width:230px;display:none;flex-direction:column;gap:6px}
.side .brand{font:800 24px/1.1 var(--display);letter-spacing:-.02em;margin-bottom:4px;text-wrap:balance}
.side p{color:var(--muted);font-size:14px;margin-bottom:14px}
.side button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-align:left;font-weight:600;color:var(--muted)}
.side button:hover{background:var(--surface)}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media(min-width:900px){.side{display:flex}}

.phone{width:390px;max-width:100%;height:min(844px,100%);background:var(--bg);border-radius:44px;border:10px solid var(--frame);box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden;position:relative}
@media(max-width:520px){.stage{padding:0}.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 20px 28px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.enter>*{animation:rise .35s both}
.screen.enter>*:nth-child(2){animation-delay:.04s}.screen.enter>*:nth-child(3){animation-delay:.08s}.screen.enter>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font:800 28px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;font-weight:500;margin-bottom:2px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font:700 16px var(--display);display:grid;place-items:center;flex:none}
.round{width:42px;height:42px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec h2{font:700 18px var(--display);letter-spacing:-.01em}
.link{color:var(--brand);font-weight:600;font-size:14px}

.alert{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--bad-bg);color:var(--bad);margin-bottom:14px}
.alert strong{display:block;font:700 16px var(--display);color:var(--ink)}
.alert span{font-size:13px;color:var(--muted)}
.alert .dot{width:38px;height:38px;border-radius:12px;background:var(--bad);color:var(--surface);display:grid;place-items:center;flex:none}
.alert.ok{background:var(--good-bg);color:var(--good)}.alert.ok .dot{background:var(--good)}

.impact{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--brand);color:var(--brand-ink);border:0}
.impact .lbl{font-size:13px;font-weight:600;opacity:.8}
.impact .big{font:800 36px/1 var(--display);letter-spacing:-.02em}
.impact .big small{font-size:18px;font-weight:700;opacity:.85}
.impact .goal{font-size:13px;opacity:.85;margin-top:6px}
.ring{position:relative;width:104px;height:104px}
.ring svg{transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.2)}.ring .fg{stroke:var(--deal);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 22px var(--display)}
:root[data-theme="dark"] .impact .tr{stroke:rgba(6,48,29,.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .impact .tr{stroke:rgba(6,48,29,.2)}}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.mini b{display:block;font:700 20px var(--display)}
.mini span{font-size:12px;color:var(--muted)}

.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.c-produce{--c:#2E9D5C}.c-dairy{--c:#3B82C4}.c-bakery{--c:#C98A12}.c-meat{--c:#D2594D}.c-prepared{--c:#1F9C95}.c-pantry{--c:#7B8A80}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
button.row:hover{border-color:var(--brand)}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mt{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.fresh{height:4px;border-radius:4px;background:var(--surface2);margin-top:8px;overflow:hidden}
.fresh i{display:block;height:100%;border-radius:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.good{background:var(--good-bg);color:var(--good)}.pill.brand{background:var(--brand-soft);color:var(--brand)}.pill.mute{background:var(--surface2);color:var(--muted)}
.quick{display:flex;gap:6px;margin-top:10px}
.quick button{flex:1;padding:8px 0;border-radius:10px;background:var(--surface2);font-weight:600;font-size:13px}
.quick button:hover{background:var(--brand-soft);color:var(--brand)}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.exp .head{display:flex;gap:12px;align-items:center}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-btn{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;text-align:left;background:var(--surface);border:1px solid var(--line);font-weight:700}
.big-btn small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.big-btn:hover{border-color:var(--brand)}
.big-btn .round{width:36px;height:36px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search input{border:0;background:none;flex:1;padding:12px 0;outline:0;min-width:0}
.search:focus-within{border-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip em{font-style:normal;opacity:.7;font-weight:500}
.meta-row{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.meta-row select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{padding:9px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

label.f{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
.in{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);outline:0}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.in.err{border-color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.errtxt{font-size:13px;color:var(--bad);margin-top:6px;font-weight:600}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center}
.stepper b{font-variant-numeric:tabular-nums;font-weight:700}
.money{position:relative}.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}.money .in{padding-left:28px}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.disc{display:flex;align-items:baseline;justify-content:space-between}
.disc b{font:800 26px var(--display);color:var(--brand)}
.clock{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.clock .col{display:flex;flex-direction:column;align-items:center;gap:2px}
.clock .col button{width:44px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center}
.clock .col b{font:800 28px/1.1 var(--display);min-width:48px;text-align:center}
.clock .sep{font:800 28px var(--display);padding-bottom:2px}
.clock .ap{padding:10px 12px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:700;margin-left:6px}

.offer{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.offer .pv{padding:16px;display:flex;flex-direction:column;gap:6px}
.offer h3{font:700 18px var(--display)}
.offer .items{font-size:13px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font:800 28px var(--display)}.price s{color:var(--muted)}
.save{background:var(--deal);color:var(--deal-ink);font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px;margin-left:auto;align-self:center}
.offer .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.prog{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .6s}
.lbl-s{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}

.partner{display:flex;flex-direction:column;gap:12px}
.partner .h{display:flex;gap:12px;align-items:center}
.partner h3{font:700 17px var(--display)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.meal{display:flex;gap:14px;align-items:center}
.meal b{font:800 40px/1 var(--display);color:var(--brand)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw button{width:48px;height:28px;border-radius:99px;background:var(--surface2);position:relative;border:1px solid var(--line);flex:none;transition:background .2s}
.sw button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw button[aria-checked="true"]{background:var(--brand)}
.sw button[aria-checked="true"]::after{transform:translateX(20px);background:var(--brand-ink)}

.chartwrap svg{width:100%;height:auto;display:block}
.chartwrap text{fill:var(--muted);font:500 11px var(--body)}
.chartwrap .val{fill:var(--ink);font:700 12px var(--body)}
.chartwrap .gl{stroke:var(--line);stroke-width:1}
.bar{fill:var(--brand-soft);cursor:pointer;transition:fill .15s}
.bar.now{fill:var(--brand)}.bar:hover{fill:var(--good)}.bar.sel{fill:var(--brand)}
.stk{display:flex;height:14px;border-radius:8px;overflow:hidden;gap:2px;margin:12px 0}
.stk i{display:block;height:100%}
.leg{display:flex;flex-direction:column;gap:8px}
.leg div{display:flex;align-items:center;gap:10px;font-size:14px}
.leg i{width:10px;height:10px;border-radius:3px}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}

.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs[hidden]{display:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative;border-radius:12px}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.tabs .bd{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

.toast{position:absolute;left:16px;right:16px;bottom:84px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:14px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast button{color:var(--deal);font-weight:800}
:root[data-theme="dark"] .toast button{color:var(--brand)}

.layer{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.layer[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(6,14,10,.5);animation:fade .2s}
.sheet{position:relative;width:100%;max-height:92%;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 0}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px}
.sh-head h2{font:800 22px var(--display);letter-spacing:-.01em}
.sh-head button{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.sh-body{overflow-y:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.cal-h button:hover{background:var(--surface2)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g i{font-style:normal;font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.cd{aspect-ratio:1;border-radius:50%;font-size:14px;font-variant-numeric:tabular-nums}
.cd:hover:not([disabled]){background:var(--surface2)}
.cd[disabled]{color:var(--line);cursor:default}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--brand)}
.cd.sel{background:var(--brand);color:var(--brand-ink);font-weight:700}
.datebtn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}

.okmark{width:76px;height:76px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:8px auto 14px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.center{text-align:center}.center h3{font:800 24px var(--display);margin-bottom:6px}.center p{color:var(--muted);margin-bottom:18px}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty b{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:4px}
.check{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.check .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check[aria-pressed="true"]{border-color:var(--brand)}
.check[aria-pressed="true"] .bx{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* onboarding */
.ob{height:100%;display:flex;flex-direction:column;padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.ob .skip{align-self:flex-end;color:var(--muted);font-weight:600;padding:8px}
.ob .viewport{flex:1;overflow:hidden;touch-action:pan-y}
.ob .track{display:flex;height:100%;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.ob .slide{flex:0 0 100%;display:flex;flex-direction:column;justify-content:center;gap:12px}
.ob .art{width:100%;max-width:260px;aspect-ratio:1;margin:0 auto 8px}
.ob h1{font:800 34px/1.05 var(--display);letter-spacing:-.025em;text-wrap:balance}
.ob p{color:var(--muted);font-size:16px;max-width:30ch}
.dots{display:flex;gap:6px;margin:14px 0 18px}
.dots i{height:6px;width:6px;border-radius:6px;background:var(--line);transition:.3s}
.dots i.on{width:26px;background:var(--brand)}
.a-fill{fill:var(--brand)}.a-soft{fill:var(--brand-soft)}.a-deal{fill:var(--deal)}.a-red{fill:#D2594D}.a-surf{fill:var(--surface)}.a-line{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<div class="stage">
  <aside class="side" id="side"></aside>
  <div class="phone"><div class="app">
    <main id="screen" class="screen"></main>
    <nav id="tabs" class="tabs" aria-label="Main"></nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="layer" class="layer" hidden></div>
  </div></div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const P={home:'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z',box:'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8',tag:'M3 12V4h8l10 10-8 8zM7.5 8.5h.01',heart:'M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z',chart:'M5 20V11M12 20V4M19 20v-6',plus:'M12 5v14M5 12h14',minus:'M5 12h14',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4',check:'M5 12.5l4.5 4.5L19 7',x:'M6 6l12 12M18 6L6 18',chev:'M9 6l6 6-6 6',left:'M15 6l-6 6 6 6',up:'M6 15l6-6 6 6',down:'M6 9l6 6 6-6',clock:'M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zM12 8v4l3 2',pin:'M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11zM12 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z',leaf:'M5 19c0-8 5-13 14-14 0 9-5 14-13 14M5 19c3-5 6-8 10-10',drop:'M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z',bread:'M4 11a4 4 0 0 1 3-6h10a4 4 0 0 1 3 6v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z',meat:'M14 4a6 6 0 0 1 0 8l-2 2-6-6 2-2a6 6 0 0 1 6-2zM10 14l-4 4M5 17l2 2',bowl:'M3 11h18a9 9 0 0 1-18 0zM8 7c0-1.5 1-2 1-3M13 7c0-1.5 1-2 1-3',jar:'M7 4h10v3H7zM6 7h12v13H6zM9 11h6v5H9z',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',alert:'M12 4l9 16H3zM12 10v4M12 17h.01',share:'M12 15V3M7 8l5-5 5 5M5 14v6h14v-6',trash:'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',bell:'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const CATS={produce:['Produce','leaf'],dairy:['Dairy','drop'],bakery:['Bakery','bread'],meat:['Meat & fish','meat'],prepared:['Prepared','bowl'],pantry:['Pantry','jar']};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=s=>new Date(s+'T00:00:00');
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const daysTo=s=>Math.round((parse(s)-today0())/864e5);
const fmtDate=s=>parse(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

/* ---------- state ---------- */
const KEY='reduce-food-waste-v2';
function seed(){const dd=n=>iso(addDays(new Date(),n));return{
  onboarded:false,goal:20,theme:'system',nid:100,
  items:[
    {id:1,name:'Baby spinach',cat:'produce',qty:6,kg:1.2,exp:dd(0)},
    {id:2,name:'Whole milk',cat:'dairy',qty:3,kg:3.0,exp:dd(0)},
    {id:3,name:'Sourdough loaves',cat:'bakery',qty:4,kg:2.4,exp:dd(1)},
    {id:4,name:'Chicken thighs',cat:'meat',qty:2,kg:1.8,exp:dd(2)},
    {id:5,name:'Greek yogurt',cat:'dairy',qty:8,kg:2.0,exp:dd(3)},
    {id:6,name:'Roasted veg tray',cat:'prepared',qty:2,kg:1.5,exp:dd(4)},
    {id:7,name:'Roma tomatoes',cat:'produce',qty:24,kg:3.0,exp:dd(5)},
    {id:8,name:'Basmati rice',cat:'pantry',qty:1,kg:5.0,exp:dd(90)}],
  stats:{used:4.8,sold:6.1,donated:4.4},daily:[1.9,2.6,1.2,3.1,2.4,2.3,1.8],
  offers:[{id:1,name:'Evening bakery box',items:['Focaccia','Croissants (6)'],price:18,disc:45,portions:4,claimed:2,time:'6:30 PM',kg:2.0,itemIds:[]}],
  requests:[]}}
function load(){try{const j=localStorage.getItem(KEY);if(j){const s=JSON.parse(j);if(s&&s.items)return s}}catch(e){}return seed()}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const UI={sel:null,range:'week',inv:{q:'',f:'all',sort:'expiry'},otab:'create',closing:null,counted:false,onlyAvail:false,notify:{},ob:0,pre:null,
  offer:{name:'',sel:[],portions:4,price:'',touched:false,disc:40,h:6,m:30,ap:'PM',err:''}};
function applyTheme(){const r=document.documentElement;if(S.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}

/* ---------- derived ---------- */
const urgency=d=>d<=0?'bad':d<=3?'warn':'good';
const dayLabel=d=>d<0?'Expired':d===0?'Today':d===1?'Tomorrow':`in ${d} days`;
const pill=it=>{if(it.listed)return '<span class="pill brand">Listed in offer</span>';if(it.held)return '<span class="pill mute">Pickup requested</span>';const d=daysTo(it.exp);return `<span class="pill ${urgency(d)}">${dayLabel(d)}</span>`};
const free=it=>!it.listed&&!it.held;
const sortedItems=()=>[...S.items].sort((a,b)=>a.exp.localeCompare(b.exp));
const saved=()=>S.stats.used+S.stats.sold+S.stats.donated;
const urgentCount=()=>S.items.filter(i=>free(i)&&daysTo(i.exp)<=0).length;
function chartData(r){const w=saved();
  if(r==='week'){const labels=[];for(let i=6;i>=0;i--)labels.push(addDays(new Date(),-i).toLocaleDateString('en-US',{weekday:'short'}));return{labels,values:[...S.daily]}}
  if(r==='month')return{labels:['3 wks ago','2 wks ago','Last wk','This wk'],values:[11.8,14.2,12.9,w]};
  const m=n=>addDays(new Date(),-30*n).toLocaleDateString('en-US',{month:'short'});return{labels:[m(2),m(1),m(0)],values:[48.2,55.6,41.1+w]}}
function totals(r){const w=saved(),tot=chartData(r).values.reduce((a,b)=>a+b,0),k=tot/w;
  const used=S.stats.used*k,sold=S.stats.sold*k,don=S.stats.donated*k;
  return{saved:tot,used,sold,donated:don,cost:used*4.2+sold*5.5,co2:tot*2.6,meals:don*2.5}}
const monthMeals=()=>39+Math.round(S.stats.donated*2.5);
function credit(kind,kg){S.stats[kind]+=kg;S.daily[6]+=kg}

/* ---------- toast / undo ---------- */
let tt,lastUndo=null;
function toast(msg,undo){const el=$('#toast');lastUndo=undo||null;el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),undo?5000:3200)}
function withUndo(msg,fn){const snap=JSON.stringify(S);fn();save();render();toast(msg,()=>{S=JSON.parse(snap);save();render()})}

/* ---------- sheets ---------- */
let cur=null;
function sheet(title,fn,opts={}){cur={title,fn};const L=$('#layer');L.hidden=false;
  L.innerHTML=`<div class="backdrop" data-act="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sh-head"><h2>${esc(opts.heading??title)}</h2><button data-act="close" aria-label="Close">${ic('x',18)}</button></div><div class="sh-body" id="sb"></div></section>`;
  refreshSheet();const first=$('#sb input,#sb button');if(first&&opts.focus)first.focus()}
function refreshSheet(){if(!cur)return;const sb=$('#sb');if(!sb)return;sb.innerHTML=cur.fn()}
function closeSheet(){cur=null;const L=$('#layer');L.hidden=true;L.innerHTML=''}

/* ---------- routing ---------- */
const ROUTES=['welcome','home','inventory','offers','donate','reports'];
const NAMES={welcome:'Onboarding',home:'Home',inventory:'Inventory',offers:'Offers',donate:'Donate',reports:'Reports'};
const NAVICON={home:'home',inventory:'box',offers:'tag',donate:'heart',reports:'chart'};
const current=()=>{const h=location.hash.slice(1);return ROUTES.includes(h)?h:(S.onboarded?'home':'welcome')};
function go(n){closeSheet();if(location.hash==='#'+n)render();else location.hash=n}
window.addEventListener('hashchange',()=>{closeSheet();render(true)});

/* ---------- screens ---------- */
function Home(){
  const hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const u=S.items.filter(i=>free(i)&&daysTo(i.exp)<=0);
  const w=saved(),pct=Math.min(1,w/S.goal),C=2*Math.PI*42;
  const t=totals('week');
  const soon=sortedItems().filter(i=>free(i)&&daysTo(i.exp)<=3).slice(0,4);
  return `<header class="top"><div><p class="sub">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</p><h1>${g}, Tien</h1></div><button class="avatar" data-act="settings" aria-label="Open preferences">T</button></header>
  ${u.length?`<button class="alert" data-act="goexp"><span class="dot">${ic('alert',20)}</span><span style="flex:1"><strong>${u.length} item${u.length>1?'s':''} expiring today</strong><span>${esc(u.map(i=>i.name).join(', '))}</span></span>${ic('chev',18)}</button>`
  :`<div class="alert ok"><span class="dot">${ic('check',20)}</span><span><strong>Nothing expires today</strong><span>Your kitchen is in good shape.</span></span></div>`}
  <section class="card impact" aria-label="Food saved this week">
    <div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><circle class="tr" cx="52" cy="52" r="42" fill="none" stroke-width="10"/><circle class="fg" id="ringfg" cx="52" cy="52" r="42" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${UI.counted?C*(1-pct):C}" data-off="${C*(1-pct)}"/></svg><b class="num">${Math.round(pct*100)}%</b></div>
    <div><p class="lbl">Food saved this week</p><p class="big num"><span data-count="${w}">${f1(w)}</span> <small>kg</small></p><p class="goal">${w>=S.goal?'Weekly goal reached':`${f1(S.goal-w)} kg to your ${S.goal} kg goal`}</p></div>
  </section>
  <div class="mini"><div><b class="num">$${Math.round(t.cost)}</b><span>Cost saved</span></div><div><b class="num">${Math.round(t.co2)} kg</b><span>CO₂ avoided</span></div><div><b class="num">${Math.round(t.meals)}</b><span>Meals donated</span></div></div>
  <div class="sec"><h2>Expiring soon</h2><button class="link" data-act="goinv">See all</button></div>
  <div class="list">${soon.length?soon.map(i=>`<div class="exp"><div class="head"><span class="tile c-${i.cat}">${ic(CATS[i.cat][1],22)}</span><div class="info" style="flex:1;min-width:0"><div class="nm" style="font-weight:700">${esc(i.name)}</div><div class="mt" style="font-size:13px;color:var(--muted)">${f1(i.kg)} kg · ${i.qty} pcs</div></div>${pill(i)}</div>
    <div class="quick"><button data-act="use" data-id="${i.id}">Used it</button><button data-act="sell" data-id="${i.id}">Sell</button><button data-act="donate" data-id="${i.id}">Donate</button></div></div>`).join(''):`<div class="empty card flat"><b>All clear</b>Nothing needs action in the next 3 days.</div>`}</div>
  <div class="sec"><h2>Quick actions</h2></div>
  <div class="two"><button class="big-btn" data-act="newoffer"><span class="round">${ic('tag',18)}</span><span>Create offer<small>Sell surplus food</small></span></button><button class="big-btn" data-act="godonate"><span class="round">${ic('heart',18)}</span><span>Find partner<small>Donate nearby</small></span></button></div>`}
function homeMount(){const ring=$('#ringfg');if(ring){requestAnimationFrame(()=>requestAnimationFrame(()=>ring.setAttribute('stroke-dashoffset',ring.dataset.off)))}
  const el=$('[data-count]');if(el&&!UI.counted&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const to=+el.dataset.count,t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/900);el.textContent=f1(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
  UI.counted=true}

function Inventory(){
  const cnt=f=>S.items.filter(i=>matchF(i,f)).length;
  const fl=[['all','All'],['today','Today'],['soon','This week'],['fresh','Fresh']];
  return `<header class="top"><div><p class="sub">${S.items.length} items · ${f1(S.items.reduce((a,b)=>a+b.kg,0))} kg</p><h1>Inventory</h1></div><button class="round" data-act="additem" aria-label="Add item">${ic('plus',22)}</button></header>
  <label class="search">${ic('search',18)}<input id="invq" data-in="invq" type="search" placeholder="Search items" value="${esc(UI.inv.q)}" aria-label="Search items"></label>
  <div class="chips" role="group" aria-label="Filter">${fl.map(([k,l])=>`<button class="chip" aria-pressed="${UI.inv.f===k}" data-act="invf" data-f="${k}">${l} <em>${cnt(k)}</em></button>`).join('')}</div>
  <div class="meta-row"><span id="invcount"></span><label>Sort <select id="invsort" data-in="invsort"><option value="expiry"${UI.inv.sort==='expiry'?' selected':''}>Expiry date</option><option value="name"${UI.inv.sort==='name'?' selected':''}>Name</option><option value="kg"${UI.inv.sort==='kg'?' selected':''}>Weight</option></select></label></div>
  <div class="list" id="invlist"></div>`}
function matchF(i,f){const d=daysTo(i.exp);return f==='all'||(f==='today'&&d<=0)||(f==='soon'&&d>0&&d<=7)||(f==='fresh'&&d>7)}
function invList(){const q=UI.inv.q.trim().toLowerCase();let a=S.items.filter(i=>matchF(i,UI.inv.f)&&(!q||i.name.toLowerCase().includes(q)||CATS[i.cat][0].toLowerCase().includes(q)));
  a.sort((x,y)=>UI.inv.sort==='name'?x.name.localeCompare(y.name):UI.inv.sort==='kg'?y.kg-x.kg:x.exp.localeCompare(y.exp));
  $('#invcount').textContent=`${a.length} shown`;
  $('#invlist').innerHTML=a.length?a.map(i=>{const d=daysTo(i.exp);return `<button class="row" data-act="item" data-id="${i.id}"><span class="tile c-${i.cat}">${ic(CATS[i.cat][1],22)}</span><span class="info"><span class="nm" style="display:block">${esc(i.name)}</span><span class="mt" style="display:block">${f1(i.kg)} kg · ${i.qty} pcs · ${fmtDate(i.exp)}</span><span class="fresh" style="display:block"><i style="width:${Math.max(6,Math.min(100,d/7*100))}%;background:var(--${urgency(d)==='bad'?'bad':urgency(d)==='warn'?'deal':'good'})"></i></span></span>${pill(i)}</button>`}).join('')
   :`<div class="empty"><b>${S.items.length?'No matches':'Your inventory is empty'}</b>${S.items.length?'Try a different search or filter.':'Add what you have so we can warn you before it expires.'}</div>`}

function ItemSheet(id){const i=S.items.find(x=>x.id===id);if(!i)return '';const d=daysTo(i.exp);
  return `<div class="row" style="border:0;padding:0 0 14px"><span class="tile c-${i.cat}" style="width:56px;height:56px">${ic(CATS[i.cat][1],28)}</span><div class="info"><div style="font:700 20px var(--display)">${esc(i.name)}</div><div class="mt">${CATS[i.cat][0]}</div></div>${pill(i)}</div>
  <div class="mini" style="margin:0 0 16px"><div><b class="num">${f1(i.kg)}</b><span>kg</span></div><div><b class="num">${i.qty}</b><span>pieces</span></div><div><b class="num">${d<0?0:d}</b><span>days left</span></div></div>
  <p class="hint" style="margin:0 0 14px">Use by ${fmtDate(i.exp)}</p>
  ${free(i)?`<div class="stack" style="gap:10px"><button class="btn" data-act="use" data-id="${i.id}">${ic('check',18)} I used it</button><div class="two"><button class="btn ghost" data-act="sell" data-id="${i.id}">${ic('tag',18)} Sell</button><button class="btn ghost" data-act="donate" data-id="${i.id}">${ic('heart',18)} Donate</button></div><button class="btn danger" data-act="del" data-id="${i.id}">${ic('trash',18)} Remove</button></div>`:`<p class="hint">${i.listed?'This item is part of a live offer.':'This item is in a pickup request.'} Close the offer or cancel the request to change it.</p>`}`}

/* add item */
function newAdd(){const t=new Date();return{name:'',cat:'produce',qty:1,kg:'',exp:iso(addDays(t,3)),calOpen:false,vy:addDays(t,3).getFullYear(),vm:addDays(t,3).getMonth(),err:{},done:false}}
function cal(a){const first=new Date(a.vy,a.vm,1),lead=(first.getDay()+6)%7,dim=new Date(a.vy,a.vm+1,0).getDate(),t0=iso(new Date());let c='';for(let i=0;i<lead;i++)c+='<span></span>';
  for(let d=1;d<=dim;d++){const v=iso(new Date(a.vy,a.vm,d));c+=`<button type="button" class="cd${v===a.exp?' sel':''}${v===t0?' today':''}" data-act="pickday" data-v="${v}" ${v<t0?'disabled':''} aria-label="${fmtDate(v)}">${d}</button>`}
  return `<div class="cal"><div class="cal-h"><button type="button" data-act="calprev" aria-label="Previous month">${ic('left',18)}</button><strong>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong><button type="button" data-act="calnext" aria-label="Next month">${ic('chev',18)}</button></div><div class="cal-g">${'MTWTFSS'.split('').map(x=>`<i>${x}</i>`).join('')}${c}</div></div>`}
function AddSheet(){const a=UI.add;
  if(a.done)return `<div class="center"><div class="okmark">${ic('check',36)}</div><h3>Added to inventory</h3><p>${esc(a.last)} will show up on Home when it is close to expiring.</p><div class="stack" style="gap:10px"><button class="btn" data-act="close">Back to inventory</button><button class="btn ghost" data-act="addmore">Add another item</button></div></div>`;
  const q=[['Today',0],['Tomorrow',1],['In 3 days',3],['In a week',7]];
  return `<label class="f" for="addname" style="margin-top:8px">Name</label><input id="addname" class="in${a.err.name?' err':''}" data-in="addname" placeholder="e.g. Fresh basil" value="${esc(a.name)}" autocomplete="off">${a.err.name?`<p class="errtxt">${a.err.name}</p>`:''}
  <label class="f">Category</label><div class="chips" style="flex-wrap:wrap;overflow:visible">${Object.entries(CATS).map(([k,v])=>`<button type="button" class="chip" aria-pressed="${a.cat===k}" data-act="addcat" data-k="${k}">${v[0]}</button>`).join('')}</div>
  <div class="two"><div><label class="f" style="margin-top:6px">Amount</label><div class="stepper"><button type="button" data-act="qty" data-d="-1" aria-label="Fewer">${ic('minus',16)}</button><b class="num">${a.qty}</b><button type="button" data-act="qty" data-d="1" aria-label="More">${ic('plus',16)}</button></div></div>
  <div><label class="f" for="addkg" style="margin-top:6px">Weight (kg)</label><input id="addkg" class="in num${a.err.kg?' err':''}" data-in="addkg" inputmode="decimal" placeholder="0.0" value="${esc(a.kg)}"></div></div>${a.err.kg?`<p class="errtxt">${a.err.kg}</p>`:''}
  <label class="f">Expiry date</label><button type="button" class="in datebtn" data-act="caltoggle" aria-expanded="${a.calOpen}"><span>${fmtDate(a.exp)}</span>${ic('cal',18)}</button>
  ${a.calOpen?cal(a):`<div class="chips" style="margin:10px 0 0">${q.map(([l,n])=>`<button type="button" class="chip" aria-pressed="${a.exp===iso(addDays(new Date(),n))}" data-act="quickexp" data-n="${n}">${l}</button>`).join('')}</div>`}
  <div style="margin-top:20px"><button class="btn" data-act="saveitem">${ic('plus',18)} Add to inventory</button></div>`}

/* offers */
function offerCalc(){const o=UI.offer,its=S.items.filter(i=>o.sel.includes(i.id));const kg=its.reduce((a,b)=>a+b.kg,0);
  const orig=o.touched?(parseFloat(o.price)||0):Math.round(kg*5.5);const fin=orig*(1-o.disc/100);return{its,kg,orig,fin,save:orig-fin}}
const money=n=>'$'+(Math.round(n*100)/100).toFixed(n%1?2:0);
const tstr=o=>`${o.h}:${pad(o.m)} ${o.ap}`;
function Offers(){const live=S.offers.length;
  return `<header class="top"><div><p class="sub">Sell surplus food</p><h1>Offers</h1></div></header>
  <div class="seg" role="tablist"><button role="tab" aria-selected="${UI.otab==='create'}" data-act="otab" data-t="create">Create offer</button><button role="tab" aria-selected="${UI.otab==='live'}" data-act="otab" data-t="live">Live offers (${live})</button></div>
  ${UI.otab==='create'?OfferForm():OfferLive()}`}
function OfferForm(){const o=UI.offer,c=offerCalc(),cand=sortedItems().filter(i=>free(i)||o.sel.includes(i.id));
  return `<label class="f" for="offname" style="margin-top:0">Bundle name</label><input id="offname" class="in" data-in="offname" placeholder="e.g. Evening bakery box" value="${esc(o.name)}" autocomplete="off">

  <label class="f" for="offdisc">Discount</label><div class="disc"><span class="hint" style="margin:0">Deeper discounts sell faster</span><b class="num" id="discv">${o.disc}%</b></div><input id="offdisc" data-in="offdisc" type="range" min="10" max="70" step="5" value="${o.disc}">

  <p class="lbl-s" style="margin:20px 0 8px">PREVIEW</p>
  <div class="offer"><div class="pv"><h3 id="pvn">${esc(o.name)||'Your bundle name'}</h3><p class="items" id="pvi">${c.its.length?esc(c.its.map(i=>i.name).join(', ')):'Choose items above'}</p><div class="price"><b class="num" id="pvf">${money(c.fin)}</b><s class="num" id="pvo">${money(c.orig)}</s><span class="save" id="pvs">${o.disc}% off</span></div></div><div class="foot"><span id="pvp">${o.portions} portions · pickup ${tstr(o)}</span><span class="pill good" id="pvv">Customers save ${money(c.save)}</span></div></div>

function updOffer(){const o=UI.offer,c=offerCalc(),set=(i,t)=>{const e=document.getElementById(i);if(e)e.textContent=t};
  set('pvn',o.name||'Your bundle name');set('pvi',c.its.length?c.its.map(i=>i.name).join(', '):'Choose items above');set('pvf',money(c.fin));set('pvo',money(c.orig));set('pvs',o.disc+'% off');set('pvp',`${o.portions} portions · pickup ${tstr(o)}`);set('pvv','Customers save '+money(c.save));set('discv',o.disc+'%');set('portv',o.portions);set('clkh',o.h);set('clkm',pad(o.m));set('clkap',o.ap);

function OfferLive(){if(!S.offers.length)return `<div class="empty"><b>No live offers</b>Create an offer and it appears here with live pickup claims.<div style="margin-top:14px"><button class="btn sm" data-act="otab" data-t="create" style="margin:auto">Create offer</button></div></div>`;
  return `<div class="list" style="gap:14px">${S.offers.map(o=>{const fin=o.price*(1-o.disc/100);return `<div class="offer"><div class="pv"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(o.name)}</h3><span class="pill good">Live</span></div><p class="items">${esc(o.items.join(', '))}</p><div class="price"><b class="num">${money(fin)}</b><s class="num">${money(o.price)}</s><span class="save">${o.disc}% off</span></div>
  <div class="prog" style="margin-top:6px" role="progressbar" aria-valuemin="0" aria-valuemax="${o.portions}" aria-valuenow="${o.claimed}"><i style="width:${o.claimed/o.portions*100}%"></i></div><p class="items num">${o.claimed} of ${o.portions} portions reserved</p></div>
  <div class="foot"><span>${ic('clock',14)} Pickup ${o.time}</span>${UI.closing===o.id?`<span style="display:flex;gap:6px"><button class="btn sm ghost" data-act="keep">Keep</button><button class="btn sm danger" data-act="closeoffer" data-id="${o.id}">Confirm close</button></span>`:`<button class="link" data-act="closeoffer" data-id="${o.id}">Close offer</button>`}</div></div>`}).join('')}</div>`}

/* donate */
const PARTNERS=[
  {id:'p1',name:'Hope Community Kitchen',type:'Community kitchen',dist:.2,avail:false,note:'Not accepting pickups until tomorrow 9 AM',accepts:['Prepared','Produce']},
  {id:'p2',name:'Riverside Food Bank',type:'Food bank',dist:1.2,avail:true,note:'Open until 8 PM',accepts:['Produce','Dairy','Bakery','Pantry']},
  {id:'p3',name:'Second Helpings Pantry',type:'Food pantry',dist:2.2,avail:true,note:'Open until 6 PM',accepts:['Bakery','Produce','Prepared']}];
const SLOTS=['Today 4–6 PM','Today 6–8 PM','Tomorrow 9–11 AM'];
function Donate(){const m=monthMeals(),goal=60,list=PARTNERS.filter(p=>!UI.onlyAvail||p.avail);
  const reqs=[...S.requests].reverse();
  return `<header class="top"><div><p class="sub">Donation partners</p><h1>Donate</h1></div></header>
  <section class="card"><div class="meal"><b class="num">${m}</b><div style="flex:1"><div style="font-weight:700">meals donated this month</div><div class="prog" style="margin:8px 0 4px"><i style="width:${Math.min(100,m/goal*100)}%"></i></div><div class="hint" style="margin:0">${m>=goal?'Monthly goal reached':`${goal-m} to your monthly goal of ${goal}`}</div></div></div></section>
  <div class="sw" style="margin:16px 0 12px"><span style="font-weight:600">Show available only</span><button role="switch" aria-checked="${UI.onlyAvail}" aria-label="Show available only" data-act="avail"></button></div>
  <div class="list" style="gap:12px">${list.map(p=>`<div class="card partner"><div class="h"><span class="tile" style="--c:${p.avail?'#2E9D5C':'#7B8A80'}">${ic('pin',22)}</span><div style="flex:1;min-width:0"><h3>${p.name}</h3><div class="mt" style="font-size:13px;color:var(--muted)">${p.type} · ${p.dist} km away</div></div><span class="pill ${p.avail?'good':'mute'}">${p.avail?'Available':'Unavailable'}</span></div>
   <div class="mt" style="font-size:13px;color:var(--muted)">${ic('clock',13)} ${p.note}</div><div class="tags">${p.accepts.map(a=>`<span class="pill mute">${a}</span>`).join('')}</div>
   ${p.avail?`<button class="btn" data-act="pickup" data-id="${p.id}">Schedule pickup</button>`:`<button class="btn ghost" data-act="notify" data-id="${p.id}">${UI.notify[p.id]?ic('check',18)+' We will notify you':ic('bell',18)+' Notify me when available'}</button>`}</div>`).join('')}</div>
  <div class="sec"><h2>Your requests</h2></div>
  ${reqs.length?`<div class="list">${reqs.map(r=>`<div class="card flat" style="padding:14px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(r.pname)}</b>${r.status==='pending'?'<span class="pill warn"><i class="spin"></i> Waiting</span>':r.status==='confirmed'?'<span class="pill good">Confirmed</span>':'<span class="pill brand">Collected</span>'}</div><p class="mt" style="font-size:13px;color:var(--muted);margin:4px 0 10px">${esc(r.names)} · ${f1(r.kg)} kg · ${r.slot}</p>
   ${r.status==='pending'?`<button class="btn sm ghost" data-act="cancelreq" data-id="${r.id}">Cancel request</button>`:r.status==='confirmed'?`<button class="btn sm" data-act="collect" data-id="${r.id}">${ic('check',16)} Mark as collected</button>`:''}</div>`).join('')}</div>`
  :`<div class="empty card flat"><b>No requests yet</b>Schedule a pickup with a partner above.</div>`}`}
function PickupSheet(){const p=UI.pk.partner,items=sortedItems().filter(free);
  if(UI.pk.done)return `<div class="center"><div class="okmark">${ic('check',36)}</div><h3>Pickup request sent!</h3><p>${esc(p.name)} will confirm within 2 hours.</p><div class="stack" style="gap:10px"><button class="btn" data-act="close">Done</button></div></div>`;
  return `<p class="hint" style="margin:6px 0 10px">${p.name} · ${p.dist} km away</p><p class="lbl-s" style="margin:8px 0">WHAT TO DONATE</p>${items.length?`<div class="list" style="gap:8px">${items.map(i=>`<button type="button" class="check" aria-pressed="${UI.pk.sel.includes(i.id)}" data-act="pktoggle" data-id="${i.id}"><span class="bx">${ic('check',14)}</span><span style="flex:1;min-width:0"><b style="font-weight:700">${esc(i.name)}</b><span class="mt" style="display:block">${f1(i.kg)} kg</span></span>${pill(i)}</button>`).join('')}</div>`:`<p class="hint">No free items to donate right now.</p>`}
  <p class="lbl-s" style="margin:18px 0 8px">PICKUP WINDOW</p><div class="chips" style="flex-wrap:wrap;overflow:visible">${SLOTS.map((s,i)=>`<button type="button" class="chip" aria-pressed="${UI.pk.slot===i}" data-act="pkslot" data-i="${i}">${s}</button>`).join('')}</div>
  <label class="f" for="pknote">Note for the team (optional)</label><textarea id="pknote" class="in" data-in="pknote" rows="2" placeholder="Fridge is on the ground floor">${esc(UI.pk.note)}</textarea>
  ${UI.pk.err?`<p class="errtxt" role="alert">${UI.pk.err}</p>`:''}<div style="margin-top:16px"><button class="btn" data-act="sendpk">Send pickup request</button></div>`}

/* reports */
function Reports(){const r=UI.range,d=chartData(r),t=totals(r),n=d.values.length;
  const W=340,H=190,L=30,B=26,T=22,iw=W-L-6,ih=H-B-T,mx=Math.max(...d.values,1);
  const step=[1,2,5,10,20,50,100].find(s=>s*4>=mx*1.05)||100,top=step*4;
  const bw=iw/n,gap=Math.min(14,bw*.28);
  const grid=[0,1,2,3,4].map(i=>{const y=T+ih-ih*i/4;return `<line class="gl" x1="${L}" x2="${W-6}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${i*step}</text>`}).join('');
  const bars=d.values.map((v,i)=>{const h=Math.max(2,ih*v/top),x=L+i*bw+gap/2,y=T+ih-h,last=i===n-1,sel=UI.sel===i;
    return `<g><rect class="bar${last?' now':''}${sel?' sel':''}" data-act="bar" data-i="${i}" x="${x}" y="${y}" width="${bw-gap}" height="${h}" rx="6" tabindex="0" role="button" aria-label="${d.labels[i]}: ${f1(v)} kg"/><text x="${x+(bw-gap)/2}" y="${H-8}" text-anchor="middle">${d.labels[i]}</text>${sel||last?`<text class="val" x="${x+(bw-gap)/2}" y="${y-6}" text-anchor="middle">${f1(v)}</text>`:''}</g>`}).join('');
  const tot=t.used+t.sold+t.donated,seg=[['Eaten before expiry',t.used,'var(--brand)'],['Sold at a discount',t.sold,'var(--deal)'],['Donated',t.donated,'#3B82C4']];
  return `<header class="top"><div><p class="sub">Your impact</p><h1>Reports</h1></div><button class="round" data-act="share" aria-label="Copy summary">${ic('share',18)}</button></header>
  <div class="seg" role="tablist">${[['week','Week'],['month','Month'],['quarter','3 months']].map(([k,l])=>`<button role="tab" aria-selected="${r===k}" data-act="range" data-r="${k}">${l}</button>`).join('')}</div>
  <section class="card"><p class="lbl-s">FOOD SAVED</p><p style="font:800 40px/1.1 var(--display)" class="num">${f1(t.saved)} <small style="font-size:18px">kg</small></p>
  <div class="chartwrap" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Food saved in kilograms">${grid}${bars}</svg></div><p class="hint" style="margin:0">Tap a bar to see its value.</p></section>
  <div class="mini"><div><b class="num">${Math.round(t.co2)} kg</b><span>CO₂ avoided</span></div><div><b class="num">${Math.round(t.meals)}</b><span>Meals donated</span></div><div><b class="num">$${Math.round(t.cost)}</b><span>Cost saved</span></div></div>
  <div class="sec"><h2>Where it went</h2></div>
  <section class="card"><div class="stk" role="img" aria-label="Breakdown of saved food">${seg.map(s=>`<i style="width:${s[1]/tot*100}%;background:${s[2]}"></i>`).join('')}</div><div class="leg">${seg.map(s=>`<div><i style="background:${s[2]}"></i>${s[0]}<b>${f1(s[1])} kg · ${Math.round(s[1]/tot*100)}%</b></div>`).join('')}</div></section>`}

/* onboarding */
const ART=[
 `<svg class="art" viewBox="0 0 240 240" aria-hidden="true"><circle class="a-soft" cx="120" cy="120" r="108"/><rect class="a-surf" x="52" y="104" width="136" height="84" rx="14"/><path class="a-line" d="M52 124h136"/><circle class="a-red" cx="88" cy="88" r="22"/><circle class="a-deal" cx="130" cy="82" r="18"/><path class="a-fill" d="M146 98c0-24 14-38 40-40-2 26-16 40-40 40z"/><circle class="a-fill" cx="170" cy="168" r="26"/><path d="M158 168l8 8 14-16" fill="none" stroke="var(--brand-ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 `<svg class="art" viewBox="0 0 240 240" aria-hidden="true"><circle class="a-soft" cx="120" cy="120" r="108"/><path class="a-deal" d="M62 120V66h54l62 62-54 54z" transform="rotate(-8 120 120)"/><circle class="a-surf" cx="88" cy="92" r="9" transform="rotate(-8 120 120)"/><text x="132" y="132" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="44" fill="#2A1E00" transform="rotate(38 132 128)">-40%</text><rect class="a-fill" x="150" y="150" width="58" height="40" rx="12"/><path d="M164 170h30" stroke="var(--brand-ink)" stroke-width="5" stroke-linecap="round"/></svg>`,
 `<svg class="art" viewBox="0 0 240 240" aria-hidden="true"><circle class="a-soft" cx="120" cy="120" r="108"/><path class="a-fill" d="M120 176s-52-30-52-72a28 28 0 0 1 52-14 28 28 0 0 1 52 14c0 42-52 72-52 72z"/><circle class="a-deal" cx="62" cy="176" r="16"/><circle class="a-red" cx="182" cy="172" r="12"/><path d="M104 118l12 12 22-24" fill="none" stroke="var(--brand-ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`];
const SLIDES=[['Reduce food waste','Track what is in your kitchen and get a nudge before anything expires.'],['Sell fast','Sell leftover dishes and ingredients at a discount to people nearby.'],['Connect with local food banks','Donate what you cannot sell. Partners collect it from your door.']];
function Welcome(){const i=UI.ob,last=i===SLIDES.length-1;
  return `<div class="ob"><button class="skip" data-act="finish">Skip</button><div class="viewport" id="obvp"><div class="track" style="transform:translateX(-${i*100}%)">${SLIDES.map((s,k)=>`<div class="slide" aria-hidden="${k!==i}">${ART[k]}<h1>${s[0]}</h1><p>${s[1]}</p></div>`).join('')}</div></div><div class="dots" aria-hidden="true">${SLIDES.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><button class="btn" data-act="${last?'finish':'obnext'}">${last?'Get started':'Next'}</button></div>`}
function welcomeMount(){const vp=$('#obvp');let x0=null;
  vp.addEventListener('pointerdown',e=>{x0=e.clientX});
  vp.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50){UI.ob=Math.max(0,Math.min(SLIDES.length-1,UI.ob+(dx<0?1:-1)));render(false)}})}

/* ---------- shell ---------- */
let lastRoute=null;
function render(scroll){const r=current(),sc=$('#screen');
  const fn={welcome:Welcome,home:Home,inventory:Inventory,offers:Offers,donate:Donate,reports:Reports}[r];
  const prev=sc.scrollTop;sc.innerHTML=fn();sc.className='screen'+(r!==lastRoute?' enter':'');sc.style.padding=r==='welcome'?'0':'';
  sc.scrollTop=(r!==lastRoute||scroll)?0:prev;
  if(r==='welcome')welcomeMount();if(r==='home')homeMount();if(r==='inventory')invList();
  lastRoute=r;
  const tabs=$('#tabs');tabs.hidden=r==='welcome';
  tabs.innerHTML=Object.keys(NAVICON).map(k=>`<button data-act="nav" data-r="${k}" ${k===r?'aria-current="page"':''}>${ic(NAVICON[k],22)}${NAMES[k]}${k==='inventory'&&urgentCount()?`<span class="bd">${urgentCount()}</span>`:''}</button>`).join('');
  $('#side').innerHTML=`<div class="brand">Reduce Food Waste</div><p>Interactive prototype. Tap through every screen; actions update your numbers.</p>${ROUTES.map(k=>`<button data-act="nav" data-r="${k}" ${k===r?'aria-current="true"':''}>${k==='welcome'?ic('eye',18):ic(NAVICON[k],18)}${NAMES[k]}</button>`).join('')}<button data-act="settings">${ic('sun',18)}Preferences</button>`;
  save()}

/* ---------- actions ---------- */
const A={
  nav:t=>go(t.dataset.r),
  obnext:()=>{UI.ob++;render()},
  finish:()=>{S.onboarded=true;UI.ob=0;save();go('home')},
  close:()=>closeSheet(),
  undo:()=>{if(lastUndo){lastUndo();lastUndo=null}$('#toast').classList.remove('on')},
  goexp:()=>{UI.inv.f='today';go('inventory')},goinv:()=>{UI.inv.f='all';go('inventory')},
  godonate:()=>go('donate'),
  newoffer:()=>{UI.otab='create';go('offers')},
  use:t=>{const id=+t.dataset.id,it=S.items.find(i=>i.id===id);if(!it)return;closeSheet();withUndo(`${it.name} marked as used. ${f1(it.kg)} kg saved`,()=>{S.items=S.items.filter(i=>i.id!==id);credit('used',it.kg)})},
  del:t=>{const id=+t.dataset.id,it=S.items.find(i=>i.id===id);closeSheet();withUndo(`${it.name} removed`,()=>{S.items=S.items.filter(i=>i.id!==id)})},
  sell:t=>{const id=+t.dataset.id;closeSheet();UI.offer.sel=[id];UI.otab='create';UI.offer.touched=false;go('offers');toast('Name your bundle and set a discount')},
  donate:t=>{UI.pre=+t.dataset.id;closeSheet();go('donate');toast('Pick a partner to donate '+S.items.find(i=>i.id===UI.pre).name.toLowerCase())},
  item:t=>{const id=+t.dataset.id;sheet('Item',()=>ItemSheet(id),{heading:'Item details'})},
  invf:t=>{UI.inv.f=t.dataset.f;render()},
  settings:()=>sheet('Preferences',()=>`<p class="lbl-s" style="margin:8px 0">APPEARANCE</p><div class="seg">${[['system','System'],['light','Light'],['dark','Dark']].map(([k,l])=>`<button aria-selected="${S.theme===k}" data-act="theme" data-k="${k}">${l}</button>`).join('')}</div>
    <p class="lbl-s" style="margin:8px 0">WEEKLY GOAL</p><div class="stepper"><button data-act="goal" data-d="-1" aria-label="Lower goal">${ic('minus',16)}</button><b class="num">${S.goal} kg</b><button data-act="goal" data-d="1" aria-label="Raise goal">${ic('plus',16)}</button></div>
    <div style="margin-top:22px;display:flex;flex-direction:column;gap:10px"><button class="btn ghost" data-act="replay">Replay onboarding</button><button class="btn danger" data-act="reset">${UI.confirmReset?'Tap again to reset all demo data':'Reset demo data'}</button></div>`),
  theme:t=>{S.theme=t.dataset.k;applyTheme();save();refreshSheet()},
  goal:t=>{S.goal=Math.max(5,Math.min(100,S.goal+ +t.dataset.d));save();refreshSheet();render()},
  replay:()=>{S.onboarded=false;UI.ob=0;closeSheet();location.hash==='#welcome'?render():go('welcome')},
  reset:()=>{if(!UI.confirmReset){UI.confirmReset=true;refreshSheet();return}UI.confirmReset=false;S=seed();UI.counted=false;applyTheme();save();closeSheet();go('welcome')},
  /* add item */
  additem:()=>{UI.add=newAdd();sheet('Add item',AddSheet,{heading:'Add item'})},
  addmore:()=>{UI.add=newAdd();refreshSheet()},
  addcat:t=>{UI.add.cat=t.dataset.k;refreshSheet()},
  qty:t=>{UI.add.qty=Math.max(1,Math.min(99,UI.add.qty+ +t.dataset.d));refreshSheet()},
  caltoggle:()=>{UI.add.calOpen=!UI.add.calOpen;refreshSheet()},
  calprev:()=>{const a=UI.add,n=new Date();if(a.vy===n.getFullYear()&&a.vm<=n.getMonth())return;a.vm--;if(a.vm<0){a.vm=11;a.vy--}refreshSheet()},
  calnext:()=>{const a=UI.add;a.vm++;if(a.vm>11){a.vm=0;a.vy++}refreshSheet()},
  pickday:t=>{const a=UI.add;a.exp=t.dataset.v;a.calOpen=false;refreshSheet()},
  quickexp:t=>{const d=addDays(new Date(),+t.dataset.n);UI.add.exp=iso(d);UI.add.vy=d.getFullYear();UI.add.vm=d.getMonth();refreshSheet()},
  saveitem:()=>{const a=UI.add;a.err={};const kg=parseFloat(a.kg);
    if(a.name.trim().length<2)a.err.name='Enter the item name.';
    if(!(kg>0)||kg>999)a.err.kg='Enter a weight between 0.1 and 999 kg.';
    if(Object.keys(a.err).length){refreshSheet();return}
    S.items.push({id:S.nid++,name:a.name.trim(),cat:a.cat,qty:a.qty,kg:Math.round(kg*10)/10,exp:a.exp});a.done=true;a.last=a.name.trim();save();refreshSheet();
    if(current()==='inventory')invList();render();},
  /* offers */
  otab:t=>{UI.otab=t.dataset.t;UI.closing=null;render()},
  offtoggle:t=>{const o=UI.offer,id=+t.dataset.id;o.sel=o.sel.includes(id)?o.sel.filter(x=>x!==id):[...o.sel,id];t.setAttribute('aria-pressed',o.sel.includes(id));updOffer()},
  portions:t=>{const o=UI.offer;o.portions=Math.max(1,Math.min(50,o.portions+ +t.dataset.d));updOffer()},
  clk:t=>{const o=UI.offer,k=t.dataset.k,d=+t.dataset.d;
    if(k==='h')o.h=((o.h-1+d+12)%12)+1;else if(k==='m')o.m=(o.m+d*15+60)%60;else o.ap=o.ap==='AM'?'PM':'AM';updOffer()},
  publish:()=>{const o=UI.offer,c=offerCalc();o.err='';
    if(o.name.trim().length<2)o.err='Give your bundle a name.';else if(!c.its.length)o.err='Choose at least one item.';else if(!(c.orig>0))o.err='Enter the original price.';
    if(o.err){render();document.querySelector('.errtxt')?.scrollIntoView({block:'center'});return}
    const id=S.nid++;S.offers.push({id,name:o.name.trim(),items:c.its.map(i=>i.name),price:c.orig,disc:o.disc,portions:o.portions,claimed:0,time:tstr(o),kg:c.kg,itemIds:c.its.map(i=>i.id)});
    c.its.forEach(i=>{const it=S.items.find(x=>x.id===i.id);if(it)it.listed=id});
    UI.offer={name:'',sel:[],portions:4,price:'',touched:false,disc:40,h:6,m:30,ap:'PM',err:''};save();scheduleClaims(id);render();
    sheet('Offer listed',()=>`<div class="center"><div class="okmark">${ic('check',36)}</div><h3>Offer listed!</h3><p>Your bundle is live for pickup.</p><div class="stack" style="gap:10px"><button class="btn" data-act="viewlive">View live offers</button><button class="btn ghost" data-act="close">Create another</button></div></div>`,{heading:' '})},
  viewlive:()=>{closeSheet();UI.otab='live';render()},
  keep:()=>{UI.closing=null;render()},
  closeoffer:t=>{const id=+t.dataset.id;if(UI.closing!==id){UI.closing=id;render();return}UI.closing=null;
    withUndo('Offer closed',()=>{S.offers=S.offers.filter(o=>o.id!==id);S.items.forEach(i=>{if(i.listed===id)delete i.listed})})},
  /* donate */
  avail:()=>{UI.onlyAvail=!UI.onlyAvail;render()},
  notify:t=>{const id=t.dataset.id;UI.notify[id]=!UI.notify[id];render();toast(UI.notify[id]?'We will tell you when it opens':'Notification turned off')},
  pickup:t=>{const p=PARTNERS.find(x=>x.id===t.dataset.id);const pre=UI.pre&&S.items.find(i=>i.id===UI.pre&&free(i))?[UI.pre]:sortedItems().filter(i=>free(i)&&daysTo(i.exp)<=2).map(i=>i.id);UI.pre=null;
    UI.pk={partner:p,sel:pre,slot:0,note:'',err:'',done:false};sheet('Schedule pickup',PickupSheet,{heading:'Schedule pickup'})},
  pktoggle:t=>{const id=+t.dataset.id,s=UI.pk.sel;UI.pk.sel=s.includes(id)?s.filter(x=>x!==id):[...s,id];UI.pk.err='';refreshSheet()},
  pkslot:t=>{UI.pk.slot=+t.dataset.i;refreshSheet()},
  sendpk:()=>{const k=UI.pk;if(!k.sel.length){k.err='Choose at least one item to donate.';refreshSheet();return}
    const its=S.items.filter(i=>k.sel.includes(i.id)),id=S.nid++;
    S.requests.push({id,pid:k.partner.id,pname:k.partner.name,itemIds:k.sel,names:its.map(i=>i.name).join(', '),kg:its.reduce((a,b)=>a+b.kg,0),slot:SLOTS[k.slot],status:'pending'});
    its.forEach(i=>i.held=id);k.done=true;save();refreshSheet();render();scheduleConfirm(id)},
  cancelreq:t=>{const id=+t.dataset.id;withUndo('Request cancelled',()=>{S.requests=S.requests.filter(r=>r.id!==id);S.items.forEach(i=>{if(i.held===id)delete i.held})})},
  collect:t=>{const id=+t.dataset.id,r=S.requests.find(x=>x.id===id);if(!r)return;
    withUndo(`Collected. ${Math.round(r.kg*2.5)} meals donated`,()=>{r.status='collected';S.items=S.items.filter(i=>i.held!==id);credit('donated',r.kg)})},
  /* reports */
  range:t=>{UI.range=t.dataset.r;UI.sel=null;render()},
  bar:t=>{const i=+t.dataset.i;UI.sel=UI.sel===i?null:i;render()},
  share:()=>{const t=totals(UI.range),txt=`I saved ${f1(t.saved)} kg of food, avoided ${Math.round(t.co2)} kg of CO₂ and donated ${Math.round(t.meals)} meals with Reduce Food Waste.`;
    const ok=()=>toast('Summary copied');try{navigator.clipboard.writeText(txt).then(ok,()=>toast(txt))}catch(e){toast(txt)}}
};
function scheduleClaims(id){[7000,16000].forEach(ms=>setTimeout(()=>{const o=S.offers.find(x=>x.id===id);if(!o||o.claimed>=o.portions)return;o.claimed++;credit('sold',o.kg/o.portions);save();render();toast(`Someone reserved 1 portion of ${o.name}`)},ms))}
function scheduleConfirm(id){setTimeout(()=>{const r=S.requests.find(x=>x.id===id);if(!r||r.status!=='pending')return;r.status='confirmed';save();render();toast(`${r.pname} confirmed your pickup`)},5000)}
S.requests.filter(r=>r.status==='pending').forEach(r=>scheduleConfirm(r.id));

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('rect[data-act="bar"]')){e.preventDefault();A.bar(e.target)}});
const IN={
  invq:v=>{UI.inv.q=v;invList()},invsort:v=>{UI.inv.sort=v;invList()},
  addname:v=>{UI.add.name=v},addkg:v=>{UI.add.kg=v.replace(',','.')},
  offname:v=>{UI.offer.name=v;updOffer()},offprice:v=>{UI.offer.price=v;UI.offer.touched=v!=='';updOffer()},offdisc:v=>{UI.offer.disc=+v;updOffer()},
  pknote:v=>{UI.pk.note=v}};
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k])IN[k](e.target.value)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k==='invsort')IN.invsort(e.target.value)});

applyTheme();render(true);
</script>

</body></html>
